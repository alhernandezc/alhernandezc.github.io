services:
  db:
    image: postgres:16
    container_name: project2026_db
    environment:
      POSTGRES_DB: project2026
      POSTRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - project2026_pgdata:/var/lib/postgresql/data
volumes:
  project2026_pgdata:
